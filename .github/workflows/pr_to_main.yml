name: Pull Request to Main
on:
  pull_request:
    branches:
      - "main"
jobs:
  pr_to_main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: default

      - name: Run pre-commit hooks
        run: pixi run lint

      - name: Run tests
        run: pixi run test
