name: Publish conda package to prefix.dev
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - run: git lfs pull

      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: default

      - name: Build conda package
        run: pixi build --output-dir dist-conda/

      - name: Upload to prefix.dev
        env:
          PREFIX_DEV_TOKEN: ${{ secrets.PREFIX_DEV_TOKEN }}
        run: |
          pixi auth login --token "$PREFIX_DEV_TOKEN" prefix.dev
          shopt -s failglob
          pixi upload https://prefix.dev/api/v1/upload/dcm-classifier-channel dist-conda/*.conda
